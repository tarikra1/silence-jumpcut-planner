[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silence-jumpcut-planner"
version = "1.0.0"
description = "Acoustic WAV speech-island detector and frame-snapped jump-cut EDL planner with consonant-safe tail padding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tarik", email = "tarikra1@users.noreply.github.com" }
]
keywords = ["audio", "wav", "silence-detection", "jump-cut", "edl", "premiere-pro", "video-editing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarikra1/silence-jumpcut-planner"
Repository = "https://github.com/tarikra1/silence-jumpcut-planner"
Changelog = "https://github.com/tarikra1/silence-jumpcut-planner/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarikra1/silence-jumpcut-planner/issues"

[project.scripts]
jumpcut-plan = "silence_jumpcut_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
